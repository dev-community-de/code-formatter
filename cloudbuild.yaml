steps:
    # install composer dependencies
    - name: 'composer:2'
      args: ['install', '--no-dev', '--optimize-autoloader']

    # build the container image
    - name: 'gcr.io/cloud-builders/docker'
      args: ['build', '-t', 'europe-west4-docker.pkg.dev/$PROJECT_ID/code-formatter/code-formatter:$COMMIT_SHA', '.']

    # push the container image to Artifact Registry
    - name: 'gcr.io/cloud-builders/docker'
      args: ['push', 'europe-west4-docker.pkg.dev/$PROJECT_ID/code-formatter/code-formatter:$COMMIT_SHA']

    # Deploy container image to Cloud Run
    - name: 'gcr.io/cloud-builders/gcloud'
      args:
      - 'run'
      - 'deploy'
      - 'code-formatter'
      - '--image'
      - 'europe-west4-docker.pkg.dev/$PROJECT_ID/code-formatter/code-formatter:$COMMIT_SHA'
      - '--region'
      - 'europe-west4'
      - '--platform'
      - 'managed'

images:
    - 'europe-west4-docker.pkg.dev/$PROJECT_ID/code-formatter/code-formatter:$COMMIT_SHA'
