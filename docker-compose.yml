services:
  web:
    build:
      context: .
      dockerfile: .docker/web/Dockerfile
    image: dev-community-code-formatter_web
    ports:
      - 8000:80
    volumes:
      - .:/srv/app
    environment:
      - API_KEY=abc
    depends_on:
      - composer
      - npm

  composer:
    image: composer:2
    command: ["composer", "install"]
    volumes:
      - .:/app

  npm:
    image: node:24
    command: ["npm", "install"]
    working_dir: /app
    volumes:
      - .:/app
